version: "3.7"

services:
    # Catalog for tempZone
    tempzone_catalog:
        build:
            context: ./catalog
            args:
                postgres_password: testpassword

    # Provider for tempZone
    tempzone_provider:
        build:
            context: ./tempZone
            args:
                irods_version: 4.2.8
                irods_zone_name: tempZone
        depends_on:
            - tempzone_catalog
        volumes:
            - "./upgrade.sh:/upgrade.sh:ro"
            - "/home/kory/dev/development_environment_output/packages:/irods_packages:ro"
            - "/opt/libc++:/opt/libc++:ro" # This is required because a debug libc++abi is being linked.
            - "./irods.crt:/irods.crt:ro"
            - "./irods.key:/irods.key:ro"
            - "./dhparams.pem:/dhparams.pem:ro"
            - "./irods_environment_with_ssl.json:/irods_environment_with_ssl.json:ro"
            - "./irods.pam:/etc/pam.d/irods:ro"

    # Catalog for otherZone
    otherzone_catalog:
        build:
            context: ./catalog
            args:
                postgres_password: testpassword

    # Provider for otherZone
    otherzone_provider:
        build:
            context: ./otherZone
            args:
                irods_version: 4.2.8
                irods_zone_name: otherZone
        depends_on:
            - otherzone_catalog
        volumes:
            - "./upgrade.sh:/upgrade.sh:ro"
            - "/home/kory/dev/development_environment_output/packages:/irods_packages:ro"
            - "/opt/libc++:/opt/libc++:ro" # This is required because a debug libc++abi is being linked.
            - "./irods.crt:/irods.crt:ro"
            - "./irods.key:/irods.key:ro"
            - "./dhparams.pem:/dhparams.pem:ro"
            - "./irods_environment_with_ssl.json:/irods_environment_with_ssl.json:ro"
            - "./irods.pam:/etc/pam.d/irods:ro"

